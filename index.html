<!DOCTYPE html>
<html>
<head>
  <title>Chat Anywhere</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #e5ddd5;
      height: 100vh;
      overflow: hidden;
    }

    /* LOGIN */
    #login {
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 20px;
      gap: 12px;
      background: #f0f0f0;
    }

    #login input, #login button {
      padding: 12px;
      font-size: 16px;
    }

    #login button {
      background: #075e54;
      color: white;
      border: none;
    }

    /* HEADER */
    .header {
      height: 50px;
      background: #075e54;
      color: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 12px;
    }

    .actions button {
      background: rgba(255,255,255,.2);
      border: none;
      color: white;
      padding: 5px 8px;
      border-radius: 4px;
      font-size: 12px;
      margin-left: 6px;
    }

    /* CHAT */
    #chat {
      position: absolute;
      top: 50px;
      bottom: 120px;
      width: 100%;
      padding: 12px;
      overflow-y: auto;
      box-sizing: border-box;
    }

    .msg-row {
      display: flex;
      width: 100%;
      margin: 10px 0;
    }

    .me-row { justify-content: flex-end; }
    .other-row { justify-content: flex-start; }

    .msg {
      max-width: 72%;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 14px;
      box-shadow: 0 1px 2px rgba(0,0,0,.15);
      background: white;
    }

    .me { background: #dcf8c6; margin-right: 6px; }
    .other { margin-left: 6px; }

    .name {
      font-size: 11px;
      font-weight: bold;
      margin-bottom: 3px;
      color: #555;
    }

    /* INPUT */
    .input-bar {
      position: fixed;
      bottom: 0;
      width: 100%;
      display: flex;
      padding: 8px;
      background: #f0f0f0;
      box-sizing: border-box;
    }

    .input-bar input {
      flex: 1;
      padding: 10px;
      border-radius: 20px;
      border: none;
      outline: none;
    }

    .input-bar button {
      margin-left: 6px;
      padding: 10px 14px;
      border-radius: 50%;
      border: none;
      background: #075e54;
      color: white;
      font-size: 16px;
    }

    .hint {
      font-size: 12px;
      color: #555;
      text-align: center;
    }
  </style>
</head>

<body>

<!-- LOGIN -->
<div id="login">
  <input id="nameInput" placeholder="Your name">
  <input id="passwordInput" type="password" placeholder="Password">
  <button onclick="enterRoom()">Enter</button>

  <div class="hint">
    (Private Room requires a different password)
  </div>
</div>

<!-- APP -->
<div id="app" style="display:none;">
  <div class="header">
    <b id="roomTitle">Chat Anywhere</b>
    <div class="actions">
      <button onclick="clearChat()">Clear</button>
      <button onclick="logout()">Logout</button>
    </div>
  </div>

  <div id="chat"></div>

  <div class="input-bar">
    <input id="msg" placeholder="Type a message">
    <button id="sendBtn">➤</button>
  </div>
</div>

<script type="module" src="script.js"></script>
</body>
</html>
