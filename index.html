<!DOCTYPE html>
<html>
<head>
  <title>Chat Anywhere</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #e5ddd5;
      height: 100vh;
      overflow: hidden;
    }

    /* HEADER */
    .header {
      height: 50px;
      background: #075e54;
      color: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 12px;
    }

    .actions button {
      background: rgba(255,255,255,.2);
      border: none;
      color: white;
      padding: 5px 8px;
      border-radius: 4px;
      font-size: 12px;
    }

    /* CHAT */
    #chat {
      position: absolute;
      top: 50px;
      bottom: 120px;
      width: 100%;
      padding: 10px;
      overflow-y: auto;
      box-sizing: border-box;
    }

    .msg {
      max-width: 75%;
      padding: 8px 12px;
      margin: 6px 0;
      border-radius: 8px;
      font-size: 14px;
      box-shadow: 0 1px 2px rgba(0,0,0,.15);
      word-wrap: break-word;
    }

    .me {
      background: #dcf8c6;
      margin-left: auto;
    }

    .other {
      background: #fff;
      margin-right: auto;
    }

    .name {
      font-size: 11px;
      font-weight: bold;
      margin-bottom: 3px;
      color: #555;
    }

    .reply-box {
      font-size: 12px;
      padding: 4px 6px;
      margin-bottom: 4px;
      border-left: 3px solid #075e54;
      background: rgba(0,0,0,.05);
    }

    /* REPLY BAR */
    #replyBar {
      position: fixed;
      bottom: 60px;
      width: 100%;
      background: #f0f0f0;
      padding: 8px;
      border-left: 4px solid #075e54;
      display: none;
      box-sizing: border-box;
      font-size: 13px;
    }

    #replyBar span {
      display: block;
      font-weight: bold;
    }

    #replyBar button {
      position: absolute;
      right: 10px;
      top: 6px;
      border: none;
      background: none;
      font-size: 16px;
    }

    /* INPUT */
    .input-bar {
      position: fixed;
      bottom: env(safe-area-inset-bottom);
      width: 100%;
      display: flex;
      padding: 8px;
      background: #f0f0f0;
      box-sizing: border-box;
    }

    .input-bar input {
      flex: 1;
      padding: 10px;
      border-radius: 20px;
      border: none;
      outline: none;
    }

    .input-bar button {
      margin-left: 6px;
      padding: 10px 14px;
      border-radius: 50%;
      border: none;
      background: #075e54;
      color: white;
      font-size: 16px;
    }
  </style>
</head>

<body>

<div class="header">
  <b>Chat Anywhere</b>
  <div class="actions">
    <button onclick="clearChat()">Clear</button>
    <button onclick="logout()">Logout</button>
  </div>
</div>

<div id="chat"></div>

<div id="replyBar">
  <span id="replyName"></span>
  <div id="replyText"></div>
  <button onclick="cancelReply()">✕</button>
</div>

<div class="input-bar">
  <input id="msg" placeholder="Type a message">
  <button id="sendBtn">➤</button>
</div>

<script type="module" src="script.js"></script>
</body>
</html>
