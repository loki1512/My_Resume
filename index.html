<!DOCTYPE html>
<html>
<head>
  <title>Chat Anywhere</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #e5ddd5;
      height: 100vh;
    }

    #login {
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 20px;
      gap: 12px;
      background: #f0f0f0;
    }

    #login input, #login button {
      padding: 12px;
      font-size: 16px;
    }

    #login button {
      background: #075e54;
      color: white;
      border: none;
    }

    .header {
      height: 50px;
      background: #075e54;
      color: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 12px;
    }

    .actions button {
      background: rgba(255,255,255,.2);
      border: none;
      color: white;
      padding: 5px 8px;
      border-radius: 4px;
      font-size: 12px;
    }

    #chat {
      position: absolute;
      top: 50px;
      bottom: 80px;
      width: 100%;
      padding: 12px;
      overflow-y: auto;
      box-sizing: border-box;
    }

    .input-bar {
      position: fixed;
      bottom: 0;
      width: 100%;
      display: flex;
      padding: 8px;
      background: #f0f0f0;
    }

    .input-bar input {
      flex: 1;
      padding: 10px;
      border-radius: 20px;
      border: none;
    }

    .input-bar button {
      margin-left: 6px;
      padding: 10px 14px;
      border-radius: 50%;
      border: none;
      background: #075e54;
      color: white;
      font-size: 16px;
    }
  </style>
</head>

<body>

<div id="login">
  <input id="nameInput" placeholder="Your name">
  <input id="passwordInput" type="password" placeholder="Password">
  <button id="enterBtn">Enter</button>
</div>

<div id="app" style="display:none;">
  <div class="header">
    <b id="roomTitle">Chat Anywhere</b>
    <div class="actions">
      <button id="clearBtn">Clear</button>
      <button id="logoutBtn">Logout</button>
    </div>
  </div>

  <div id="chat"></div>

  <div class="input-bar">
    <input id="msg" placeholder="Type a message">
    <button id="sendBtn">➤</button>
  </div>
</div>

<!-- IMPORTANT: defer + module -->
<script type="module" src="script.js" defer></script>
</body>
</html>
