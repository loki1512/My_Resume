<!DOCTYPE html>
<html>
<head>
  <title>Chat Anywhere</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #e5ddd5;
    }

    /* HEADER */
    .header {
      background: #075e54;
      color: white;
      padding: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .title {
      font-size: 16px;
      font-weight: bold;
    }

    .actions {
      display: flex;
      gap: 10px;
    }

    .actions button {
      background: rgba(255,255,255,0.2);
      border: none;
      color: white;
      padding: 6px 10px;
      border-radius: 4px;
      font-size: 12px;
    }

    /* CHAT */
    #chat {
      padding: 10px;
      height: calc(100vh - 130px);
      overflow-y: auto;
    }

    .msg {
      max-width: 75%;
      padding: 8px 12px;
      margin: 6px 0;
      border-radius: 8px;
      font-size: 14px;
      clear: both;
    }

    .me {
      background: #dcf8c6;
      float: right;
    }

    .other {
      background: #fff;
      float: left;
    }

    .name {
      font-size: 11px;
      color: #555;
      margin-bottom: 2px;
    }

    /* INPUT BAR */
    .input-bar {
      display: flex;
      padding: 8px;
      background: #f0f0f0;
      position: fixed;
      bottom: 0;
      width: 100%;
    }

    .input-bar input {
      flex: 1;
      padding: 10px;
      border-radius: 20px;
      border: none;
      outline: none;
    }

    .input-bar button {
      margin-left: 8px;
      padding: 10px 16px;
      border-radius: 50%;
      border: none;
      background: #075e54;
      color: white;
      font-size: 16px;
    }
  </style>
</head>

<body>

<div class="header">
  <div class="title">Chat Anywhere</div>
  <div class="actions">
    <button onclick="clearChat()">Clear</button>
    <button onclick="logout()">Logout</button>
  </div>
</div>

<div id="chat"></div>

<div class="input-bar">
  <input id="msg" placeholder="Type a message">
  <button id="sendBtn">➤</button>
</div>

<script type="module" src="script.js"></script>
</body>
</html>
