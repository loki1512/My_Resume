<!DOCTYPE html>
<html lang="en">
<head>
  <title>Chat Anywhere</title>

  <!-- PWA -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#075e54">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon-192.png">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #e5ddd5;
      height: 100vh;
      overflow: hidden;
    }

    .header {
      height: 50px;
      background: #075e54;
      color: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 12px;
    }

    .actions button {
      background: rgba(255,255,255,.2);
      border: none;
      color: white;
      padding: 5px 8px;
      border-radius: 4px;
      font-size: 12px;
      margin-left: 6px;
    }

    #chat {
      position: absolute;
      top: 50px;
      bottom: 120px;
      width: 100%;
      padding: 12px;
      overflow-y: auto;
      box-sizing: border-box;
    }

    .msg-row {
      display: flex;
      width: 100%;
      margin: 10px 0;
    }

    .me-row { justify-content: flex-end; }
    .other-row { justify-content: flex-start; }

    .msg {
      max-width: 72%;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 14px;
      box-shadow: 0 1px 2px rgba(0,0,0,.15);
      background: white;
      word-wrap: break-word;
    }

    .me { background: #dcf8c6; margin-right: 6px; }
    .other { margin-left: 6px; }

    .name {
      font-size: 11px;
      font-weight: bold;
      margin-bottom: 3px;
      color: #555;
    }

    .reply-box {
      font-size: 12px;
      padding: 4px 6px;
      margin-bottom: 4px;
      border-left: 3px solid #075e54;
      background: rgba(0,0,0,.05);
    }

    #replyBar {
      position: fixed;
      bottom: 60px;
      width: 100%;
      background: #f0f0f0;
      padding: 8px;
      border-left: 4px solid #075e54;
      display: none;
      box-sizing: border-box;
      font-size: 13px;
    }

    #replyBar button {
      position: absolute;
      right: 10px;
      top: 6px;
      border: none;
      background: none;
      font-size: 16px;
    }

    .input-bar {
      position: fixed;
      bottom: env(safe-area-inset-bottom);
      width: 100%;
      display: flex;
      padding: 8px;
      background: #f0f0f0;
      box-sizing: border-box;
    }

    .input-bar input {
      flex: 1;
      padding: 10px;
      border-radius: 20px;
      border: none;
      outline: none;
    }

    .input-bar button {
      margin-left: 6px;
      padding: 10px 14px;
      border-radius: 50%;
      border: none;
      background: #075e54;
      color: white;
      font-size: 16px;
    }
  </style>
</head>

<body>

<div class="header">
  <b>Chat Anywhere</b>
  <div class="actions">
    <button onclick="clearChat()">Clear</button>
    <button onclick="logout()">Logout</button>
  </div>
</div>

<div id="chat"></div>

<div id="replyBar">
  <b id="replyName"></b><br>
  <span id="replyText"></span>
  <button onclick="cancelReply()">✕</button>
</div>

<div class="input-bar">
  <input id="msg" placeholder="Type a message">
  <button id="sendBtn">➤</button>
</div>

<script type="module" src="script.js"></script>

<!-- Service worker -->
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js');
  }
</script>

</body>
</html>
