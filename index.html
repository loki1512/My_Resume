<!DOCTYPE html>
<html>
<head>
  <title>Chat Anywhere</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #e5ddd5;
    }

    /* HEADER */
    .header {
      background: #075e54;
      color: white;
      padding: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 4px rgba(0,0,0,.2);
    }

    .actions button {
      background: rgba(255,255,255,.2);
      border: none;
      color: white;
      padding: 6px 10px;
      border-radius: 4px;
      font-size: 12px;
    }

    /* CHAT */
    #chat {
      padding: 12px;
      height: calc(100vh - 170px);
      overflow-y: auto;
    }

    .msg {
      max-width: 75%;
      padding: 8px 12px;
      margin: 10px 0;
      border-radius: 8px;
      font-size: 14px;
      clear: both;
      box-shadow: 0 1px 2px rgba(0,0,0,.15);
      position: relative;
      transition: transform .2s;
    }

    .me {
      background: #dcf8c6;
      float: right;
    }

    .other {
      background: white;
      float: left;
    }

    .name {
      font-size: 11px;
      color: #555;
      margin-bottom: 4px;
      font-weight: bold;
    }

    .reply-box {
      background: rgba(0,0,0,.05);
      border-left: 3px solid #075e54;
      padding: 4px 6px;
      font-size: 12px;
      margin-bottom: 6px;
    }

    /* REPLY PREVIEW */
    #replyPreview {
      display: none;
      background: #f0f0f0;
      padding: 8px;
      border-left: 4px solid #075e54;
      font-size: 13px;
    }

    /* INPUT */
    .input-bar {
      display: flex;
      padding: 8px;
      background: #f0f0f0;
      position: fixed;
      bottom: 0;
      width: 100%;
      gap: 6px;
    }

    .input-bar input {
      flex: 1;
      padding: 10px;
      border-radius: 20px;
      border: none;
      outline: none;
    }

    .input-bar button {
      padding: 10px 16px;
      border-radius: 50%;
      border: none;
      background: #075e54;
      color: white;
      font-size: 16px;
    }
  </style>
</head>

<body>

<div class="header">
  <b>Chat Anywhere</b>
  <div class="actions">
    <button onclick="clearChat()">Clear</button>
    <button onclick="logout()">Logout</button>
  </div>
</div>

<div id="chat"></div>

<div id="replyPreview"></div>

<div class="input-bar">
  <input id="msg" placeholder="Type a message">
  <button id="sendBtn">➤</button>
</div>

<script type="module" src="script.js"></script>
</body>
</html>
